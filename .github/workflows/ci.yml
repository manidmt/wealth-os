name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  navigator:
    name: wealth-navigator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-navigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wealth-navigator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  agent:
    name: wealth-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wealth-agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
