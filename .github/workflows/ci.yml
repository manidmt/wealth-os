name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  navigator:
    name: wealth-navigator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-navigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wealth-navigator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  agent:
    name: wealth-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            wealth-agent/requirements-dev.txt
            wealth-agent/requirements-mcp-dev.txt
      # Dos juegos de dependencias en entornos separados: mcp exige
      # uvicorn>=0.31.1 y el agente FastAPI está clavado en 0.30.1.
      - name: agent deps + tests
        run: |
          python -m venv .venv-agent
          .venv-agent/bin/pip install -r requirements-dev.txt
          .venv-agent/bin/python -m pytest -v tests/test_data_service.py tests/test_financial_tools.py
      - name: mcp deps + tests
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/pip install -r requirements-mcp-dev.txt
          .venv-mcp/bin/python -m pytest -v
